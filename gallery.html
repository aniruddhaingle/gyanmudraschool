<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery - Gyan Mudra Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f2f4f8;
      font-family: 'Segoe UI', sans-serif;
    }
    .gallery-container {
      padding: 40px 20px;
    }
    h2 {
      text-align: center;
      color: #1a73e8;
      margin-bottom: 30px;
    }
    .btn-group .btn {
      margin: 0 5px 15px 5px;
    }
    .gallery-img {
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }
    .gallery-img:hover {
      transform: scale(1.05);
    }
    .gallery-item {
      display: none;
    }
    .gallery-item.show {
      display: block;
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h2>Gallery - Gyan Mudra Academy</h2>

  <!-- Filter Buttons -->
  <div class="text-center mb-4">
    <div class="btn-group">
      <button class="btn btn-outline-primary filter-btn active" data-filter="all">All</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="festival">Festivals</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="tour">Educational Tour</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="culture">Cultural</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="yoga">Yoga</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="rakhi">Rakhi Making</button>
      <button class="btn btn-outline-primary filter-btn" data-filter="rangoli">Rangoli Making</button>
    </div>
  </div>

  <!-- Gallery Grid -->
  <div class="row g-4">
    <!-- Example Images (Replace with your own or use PHP to loop dynamically) -->
    <div class="col-md-4 gallery-item festival show">
      <img src="images/festival_1.jpg" class="img-fluid gallery-img" alt="Festival">
    </div>
    <div class="col-md-4 gallery-item tour show">
      <img src="images/tour_1.jpg" class="img-fluid gallery-img" alt="Tour">
    </div>
    <div class="col-md-4 gallery-item culture show">
      <img src="images/culture_1.jpg" class="img-fluid gallery-img" alt="Culture">
    </div>
    <div class="col-md-4 gallery-item yoga show">
      <img src="images/yoga_1.jpg" class="img-fluid gallery-img" alt="Yoga">
    </div>
    <div class="col-md-4 gallery-item rakhi show">
      <img src="images/rakhi_1.jpg" class="img-fluid gallery-img" alt="Rakhi">
    </div>
    <div class="col-md-4 gallery-item rangoli show">
      <img src="images/rangoli_1.jpg" class="img-fluid gallery-img" alt="Rangoli">
    </div>
  </div>
</div>

<!-- JS to Filter -->
<script>
  const filterButtons = document.querySelectorAll('.filter-btn');
  const galleryItems = document.querySelectorAll('.gallery-item');

  filterButtons.forEach(button => {
    button.addEventListener('click', () => {
      document.querySelector('.filter-btn.active').classList.remove('active');
      button.classList.add('active');
      const filter = button.getAttribute('data-filter');
      
      galleryItems.forEach(item => {
        if (filter === 'all' || item.classList.contains(filter)) {
          item.classList.add('show');
        } else {
          item.classList.remove('show');
        }
      });
    });
  });
</script>

</body>
</html>
